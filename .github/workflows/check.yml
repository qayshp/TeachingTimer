name: Watch checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A later docs-only main push must not cancel an earlier app verification.
  # PR ranges include the whole proposed diff, so newer PR runs may replace old ones.
  group: watch-checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.impact.outputs.app_changed }}
      docs_changed: ${{ steps.impact.outputs.docs_changed }}
      tooling_changed: ${{ steps.impact.outputs.tooling_changed }}
      workflow_changed: ${{ steps.impact.outputs.workflow_changed }}
      unknown_changed: ${{ steps.impact.outputs.unknown_changed }}
      mac_verify: ${{ steps.impact.outputs.mac_verify }}
      publish: ${{ steps.impact.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 scripts/change-impact.py --base "$PR_BASE" --head "$PR_HEAD" --output "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = push ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -q '^0\+$'; then
            python3 scripts/change-impact.py --base "$PUSH_BEFORE" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
          else
            python3 scripts/change-impact.py --all --output "$GITHUB_OUTPUT"
          fi

  lightweight:
    name: Repository and Python checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check repository files and documentation links
        run: python3 scripts/check-repository.py
      - name: Run Python tooling tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v

  workflow-lint:
    name: Lint GitHub workflows
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned actionlint
        env:
          GOBIN: "${{ runner.temp }}/bin"
        run: |
          mkdir -p "$GOBIN"
          go install 'github.com/rhysd/actionlint/cmd/actionlint@v1.7.7'
      - name: Lint workflow files
        run: |
          "$RUNNER_TEMP/bin/actionlint" .github/workflows/*.yml

  verify:
    name: Watch Simulator and archive verification
    needs: changes
    if: needs.changes.outputs.mac_verify == 'true'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify models, tools, Simulator and unsigned archives
        run: python3 scripts/verify-build.py "$RUNNER_TEMP/TeachingTimerVerification" --simulator-smoke --prepare-ci-runtime
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TeachingTimerVerification/*.log
            ${{ runner.temp }}/TeachingTimerVerification/verification.json
            ${{ runner.temp }}/TeachingTimerVerification/Simulator.xcresult
            ${{ runner.temp }}/TeachingTimerVerification/simulator-smoke/
            ${{ runner.temp }}/TeachingTimerVerification/runtime-preparation/
            ${{ runner.temp }}/TeachingTimerVerification/*-archive/build.log
            ${{ runner.temp }}/TeachingTimerVerification/*-archive/readiness.json
            ${{ runner.temp }}/TeachingTimerVerification/*-archive/artifact-inspection.json

  required-result:
    name: Required result
    if: always()
    needs: [changes, lightweight, workflow-lint, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WORKFLOW_CHANGED: ${{ needs.changes.outputs.workflow_changed }}
          MAC_VERIFY: ${{ needs.changes.outputs.mac_verify }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$LIGHTWEIGHT_RESULT" = success
          if [ "$WORKFLOW_CHANGED" = true ]; then test "$WORKFLOW_LINT_RESULT" = success; fi
          if [ "$MAC_VERIFY" = true ]; then test "$VERIFY_RESULT" = success; fi
