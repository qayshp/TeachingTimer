name: Watch checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: watch-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify models, tools, Simulator and unsigned archives
        run: python3 scripts/verify-build.py "$RUNNER_TEMP/TeachingTimerVerification"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TeachingTimerVerification/*.log
            ${{ runner.temp }}/TeachingTimerVerification/verification.json
            ${{ runner.temp }}/TeachingTimerVerification/Simulator.xcresult
            ${{ runner.temp }}/TeachingTimerVerification/*-archive/build.log
            ${{ runner.temp }}/TeachingTimerVerification/*-archive/readiness.json
            ${{ runner.temp }}/TeachingTimerVerification/*-archive/artifact-inspection.json
