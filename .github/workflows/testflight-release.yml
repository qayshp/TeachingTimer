name: TestFlight maintainer release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Rehearsal stays offline, publish is internal-only, and store-candidate on main uploads for private testing
        type: choice
        options: [rehearsal, publish, store-candidate]
        default: rehearsal
        required: true
      build_number:
        description: Unused YYMMDD.HHmm.sequence or positive integer; overrides the build without editing source
        type: string
        required: true
      testing_notes:
        description: Optional What to Test override (1–4000 characters); leave empty for reviewed recent changes
        type: string
        required: false
permissions:
  contents: read
  actions: read
env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.impact.outputs.app_changed }}
      docs_changed: ${{ steps.impact.outputs.docs_changed }}
      tooling_changed: ${{ steps.impact.outputs.tooling_changed }}
      workflow_changed: ${{ steps.impact.outputs.workflow_changed }}
      unknown_changed: ${{ steps.impact.outputs.unknown_changed }}
      mac_verify: ${{ steps.impact.outputs.mac_verify }}
      release_verify: ${{ steps.impact.outputs.release_verify }}
      publish: ${{ steps.impact.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = push ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -q '^0\+$'; then
            python3 scripts/change-impact.py --base "$PUSH_BEFORE" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
          else
            # Manual rehearsal/publish always receives complete verification.
            python3 scripts/change-impact.py --all --output "$GITHUB_OUTPUT"
          fi

  tooling-checks:
    name: Release tooling checks
    needs: changes
    if: needs.changes.outputs.tooling_changed == 'true' && needs.changes.outputs.release_verify != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify repository and Python tooling
        run: |
          python3 scripts/check-repository.py
          python3 -m unittest discover -s Tests -p 'test_*.py' -v

  workflow-lint:
    name: Release workflow lint
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned actionlint
        env:
          GOBIN: "${{ runner.temp }}/bin"
        run: |
          mkdir -p "$GOBIN"
          go install 'github.com/rhysd/actionlint/cmd/actionlint@v1.7.7'
      - name: Lint workflow files
        run: |
          "$RUNNER_TEMP/bin/actionlint" .github/workflows/*.yml

  source:
    name: Resolve immutable release source
    needs: changes
    if: needs.changes.outputs.release_verify == 'true'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      build_number: ${{ steps.source.outputs.build_number }}
      notes_payload: ${{ steps.source.outputs.notes_payload }}
    steps:
      - name: Check out release tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Check out reviewed application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Resolve source and validate inputs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          TESTING_NOTES: ${{ inputs.testing_notes }}
        run: |
          python3 - <<'PY'
          import json, os, runpy, subprocess, sys
          sys.path.insert(0, 'automation/scripts')
          from testflight_build_number import automatic_build_number_for_run
          sha = subprocess.check_output(['git', '-C', 'source', 'rev-parse', 'HEAD'], text=True).strip()
          if sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Application source differs from the selected workflow commit')
          if os.environ['EVENT_NAME'] == 'push':
              run_id = int(os.environ['GITHUB_RUN_ID'])
              repo = os.environ['GITHUB_REPOSITORY']
              run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}'], timeout=30))
              number = automatic_build_number_for_run(run, run_id, int(os.environ['WORKFLOW_RUN_NUMBER']), sha)
          else:
              validate_number = runpy.run_path('automation/scripts/testflight-release.py')['build_number']
              number = validate_number(os.environ['BUILD_NUMBER'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('build_number=' + str(number) + '\n')
          subprocess.run([sys.executable, 'automation/scripts/testflight-notes.py',
              '--source', 'source', '--expected-sha', sha, '--override-env', 'TESTING_NOTES',
              '--output', os.environ['RUNNER_TEMP'] + '/testflight-notes',
              '--github-output', os.environ['GITHUB_OUTPUT']], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY

  verify-reused:
    name: Reuse exact-source Watch verification
    needs: [changes, source]
    if: github.event_name == 'push' && needs.changes.outputs.release_verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run_id: ${{ steps.reuse.outputs.run_id }}
      run_attempt: ${{ steps.reuse.outputs.run_attempt }}
      artifact_id: ${{ steps.reuse.outputs.artifact_id }}
      artifact_digest: ${{ steps.reuse.outputs.artifact_digest }}
    steps:
      - name: Check out trusted release tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require completed exact-source Watch checks and evidence
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
        run: |
          python3 scripts/reuse-watch-verification.py \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            --sha "$SOURCE_SHA" --output "$RUNNER_TEMP/reused-verification" \
            --timeout-seconds 2400
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'reused-verification/receipt.json').read_text())
          fields = {'run_id': 'runID', 'run_attempt': 'runAttempt',
                    'artifact_id': 'artifactID', 'artifact_digest': 'artifactDigest'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, field in fields.items():
                  output.write(key + '=' + str(receipt[field]) + '\n')
          PY
      - name: Record verification origin
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/reused-verification/summary.md"; then
            cat "$RUNNER_TEMP/reused-verification/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain verification receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reused-watch-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/reused-verification/receipt.json
            ${{ runner.temp }}/reused-verification/verification.json
            ${{ runner.temp }}/reused-verification/summary.md

  verify:
    name: Verify reviewed source manually
    needs: [changes, source]
    # Manual dispatch remains a fresh full check, including PR candidates and
    # recovery when the main-push evidence has expired or cannot be reused.
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.release_verify == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Check out release tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Check out reviewed application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Record selected toolchain
        run: |
          xcodebuild -version
      - name: Test release tooling
        run: sh automation/scripts/check-tools.sh
      - name: Verify application models, Simulator and unsigned archives
        working-directory: source
        run: python3 scripts/verify-build.py "$RUNNER_TEMP/application-verification" --simulator-smoke --prepare-ci-runtime
      - name: Retain non-secret verification report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-checks-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/application-verification/verification.json
            ${{ runner.temp }}/application-verification/*.log
            ${{ runner.temp }}/application-verification/simulator-smoke/
            ${{ runner.temp }}/application-verification/runtime-preparation/
            ${{ runner.temp }}/application-verification/screen-text-smoke/
            ${{ runner.temp }}/application-verification/control-outline-smoke/fixtures/
            ${{ runner.temp }}/application-verification/*-archive/build.log
            ${{ runner.temp }}/application-verification/*-archive/readiness.json
            ${{ runner.temp }}/application-verification/*-archive/artifact-inspection.json
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Prepare and release
    needs: [changes, source, verify-reused, verify, tooling-checks, workflow-lint]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      needs.source.result == 'success' &&
      (
        (github.event_name == 'push' &&
         needs.changes.outputs.publish == 'true' &&
         needs.verify-reused.result == 'success' &&
         needs.verify.result == 'skipped') ||
        (github.event_name == 'workflow_dispatch' &&
         needs.verify.result == 'success' &&
         needs.verify-reused.result == 'skipped' &&
         (inputs.mode != 'store-candidate' || github.ref == 'refs/heads/main'))
      ) &&
      (needs.tooling-checks.result == 'success' || needs.tooling-checks.result == 'skipped') &&
      (needs.workflow-lint.result == 'success' || needs.workflow-lint.result == 'skipped')
    runs-on: xcode-27
    timeout-minutes: 60
    # A rehearsal never enters the credential-bearing environment.
    environment: ${{ (github.event_name == 'push' || inputs.mode == 'publish' || inputs.mode == 'store-candidate') && 'testflight-maintainer' || 'testflight-rehearsal' }}
    steps:
      - name: Check out release tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Check out verified immutable application revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Materialize reviewed TestFlight notes
        env:
          NOTES_PAYLOAD: ${{ needs.source.outputs.notes_payload }}
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
        run: |
          python3 automation/scripts/testflight-notes.py \
            --payload-env NOTES_PAYLOAD --expected-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/testflight-notes"
      - name: Record workflow timings and prepare notes
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_VERIFY_RUN: ${{ needs.verify-reused.outputs.run_id }}
          WATCH_VERIFY_ATTEMPT: ${{ needs.verify-reused.outputs.run_attempt }}
          WATCH_VERIFY_ARTIFACT: ${{ needs.verify-reused.outputs.artifact_id }}
          WATCH_VERIFY_DIGEST: ${{ needs.verify-reused.outputs.artifact_digest }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          repo = os.environ['GITHUB_REPOSITORY']; run = os.environ['GITHUB_RUN_ID']
          info = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/actions/runs/' + run]))
          jobs = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/actions/runs/' + run + '/jobs']))
          record = dict(workflowCreatedAt=info['created_at'], workflowStartedAt=info['run_started_at'],
              runURL=info['html_url'], xcode=subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              jobs=[dict(name=j['name'], startedAt=j['started_at'], completedAt=j['completed_at']) for j in jobs['jobs']])
          record['notes'] = json.loads((root / 'testflight-notes/notes.json').read_text())
          record['verification'] = dict(mode='manual-full', source=os.environ['GITHUB_SHA'])
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              if not all(os.environ[key] for key in ('WATCH_VERIFY_RUN', 'WATCH_VERIFY_ATTEMPT',
                                                     'WATCH_VERIFY_ARTIFACT', 'WATCH_VERIFY_DIGEST')):
                  raise SystemExit('Missing exact-source verification identity; refusing signing')
              record['verification'].update(mode='watch-checks',
                  runID=int(os.environ['WATCH_VERIFY_RUN']), runAttempt=int(os.environ['WATCH_VERIFY_ATTEMPT']),
                  artifactID=int(os.environ['WATCH_VERIFY_ARTIFACT']), artifactDigest=os.environ['WATCH_VERIFY_DIGEST'],
                  runURL='https://github.com/' + repo + '/actions/runs/' + os.environ['WATCH_VERIFY_RUN'])
          (root / 'ci-timing.json').write_text(json.dumps(record, indent=2))
          PY
      - name: Install temporary signing credentials
        if: github.event_name == 'push' || inputs.mode == 'publish' || inputs.mode == 'store-candidate'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          CONTAINER_PROFILE_BASE64: ${{ secrets.CONTAINER_PROFILE_BASE64 }}
          WATCH_PROFILE_BASE64: ${{ secrets.WATCH_PROFILE_BASE64 }}
          COMPLICATION_PROFILE_BASE64: ${{ secrets.COMPLICATION_PROFILE_BASE64 }}
        run: python3 automation/scripts/ci-signing.py setup "$RUNNER_TEMP/testflight-signing"
      - name: Compile API authentication helper
        if: github.event_name == 'push' || inputs.mode == 'publish' || inputs.mode == 'store-candidate'
        run: swiftc automation/scripts/asc-token.swift -o "$RUNNER_TEMP/asc-token"
      - name: Rehearse without credentials or publishing API calls
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rehearsal'
        env:
          BUILD_NUMBER: ${{ needs.source.outputs.build_number }}
        run: |
          python3 automation/scripts/testflight-release.py --rehearsal \
            --source "$GITHUB_WORKSPACE/source" --build-number "$BUILD_NUMBER" \
            --notes-file "$RUNNER_TEMP/testflight-notes/notes.txt" --output "$RUNNER_TEMP/release-report" \
            --ci-timing-file "$RUNNER_TEMP/ci-timing.json"
      - name: Publish, monitor processing, and assign only Maintainer pilot
        if: github.event_name == 'push' || inputs.mode == 'publish' || inputs.mode == 'store-candidate'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ needs.source.outputs.build_number }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/testflight-signing/AuthKey.p8"
          export ASC_TOKEN_HELPER="$RUNNER_TEMP/asc-token"
          set --
          if [ "$RELEASE_MODE" = store-candidate ]; then
            set -- --app-store-candidate
          fi
          python3 automation/scripts/testflight-release.py \
            --source "$GITHUB_WORKSPACE/source" --build-number "$BUILD_NUMBER" \
            --notes-file "$RUNNER_TEMP/testflight-notes/notes.txt" --output "$RUNNER_TEMP/release-report" \
            --signing-config "$RUNNER_TEMP/testflight-signing/signing.json" \
            --ci-timing-file "$RUNNER_TEMP/ci-timing.json" "$@"
      - name: Remove temporary signing material and restore keychain search list
        if: always() && (github.event_name == 'push' || inputs.mode == 'publish' || inputs.mode == 'store-candidate')
        run: python3 automation/scripts/ci-signing.py cleanup "$RUNNER_TEMP/testflight-signing"
      - name: Collect GitHub job and step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '{jobs: [.jobs[] | {name, startedAt: .started_at, completedAt: .completed_at, steps: [.steps[] | {name, startedAt: .started_at, completedAt: .completed_at, status, conclusion}]}]}' \
            > "$RUNNER_TEMP/job-timings.json"
      - name: Publish timing summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/release-report/summary.md"; then
            cat "$RUNNER_TEMP/release-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Release did not start. Check verification, credentials, and runner setup.' >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PYCODE'
          import json, os
          from datetime import datetime
          from pathlib import Path
          file = Path(os.environ['RUNNER_TEMP']) / 'job-timings.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n## GitHub step timings\n\n| Job / step | Seconds | Result |\n| --- | ---: | --- |\n')
              if file.exists() and file.stat().st_size:
                  for job in json.loads(file.read_text())['jobs']:
                      for step in job['steps']:
                          start, end = step['startedAt'], step['completedAt']
                          seconds = round((datetime.fromisoformat(end.replace('Z', '+00:00')) - datetime.fromisoformat(start.replace('Z', '+00:00'))).total_seconds(), 3) if start and end else 'pending'
                          summary.write('| ' + job['name'] + ' / ' + step['name'] + ' | ' + str(seconds) + ' | ' + str(step['conclusion']) + ' |\n')
          PYCODE
      - name: Retain timing and release identity (never signing material)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-release-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/release-report/release.json
            ${{ runner.temp }}/release-report/summary.md
            ${{ runner.temp }}/ci-timing.json
            ${{ runner.temp }}/testflight-notes/notes.txt
            ${{ runner.temp }}/testflight-notes/notes.json
            ${{ runner.temp }}/job-timings.json
